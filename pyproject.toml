[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobtracker"
version = "0.3.0"
description = "An agent-driven job-search pipeline: score postings, tailor resumes, and track applications."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Patrick Beal" }]
dependencies = ["rich>=13.7"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]

[project.urls]
Homepage = "https://github.com/jpatrickb/jobtracker"
Repository = "https://github.com/jpatrickb/jobtracker"
Issues = "https://github.com/jpatrickb/jobtracker/issues"

[project.scripts]
jobtracker = "jobtracker.cli:main"
jta = "jobtracker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jobtracker = ["templates/**/*"]

[tool.setuptools]
include-package-data = true
