name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install jobtracker (editable)
        run: pip install -e .

      - name: Run smoke test
        run: ./smoke_test.sh ci

      - name: Confirm the package builds (sdist + wheel)
        run: |
          python -m pip install build
          python -m build
