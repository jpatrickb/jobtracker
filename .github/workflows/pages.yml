name: Deploy install script to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - install.sh
      - .github/workflows/pages.yml
  # Allow manually re-running a deploy without needing a new commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Avoid two concurrent deploys stepping on each other; let a newer push supersede an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Assemble Pages site
        run: |
          mkdir -p _site
          cp install.sh _site/install.sh
          cp index.html _site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
