name: Publish jobtracker-agents to npm

on:
  push:
    branches: [main]
    paths:
      - "installer/**"

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: installer
    permissions:
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      # Trusted Publishing (OIDC) needs npm >=11.5; actions/setup-node's bundled npm may be older.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc)
        run: npm run build

      # Publishing is version-gated, not event-gated: a normal commit bumping package.json's
      # version is the only "release" step (see installer/PUBLISHING.md) -- a docs-only or
      # non-version-bumping change to installer/ merging to main must no-op here rather than
      # attempt (and fail) a duplicate publish of the same version.
      - name: Check whether the version changed
        id: version-check
        run: |
          local_version="$(node -p "require('./package.json').version")"
          published_version="$(npm view jobtracker-agents version 2>/dev/null || echo "0.0.0")"
          echo "Local: $local_version -- Published: $published_version"
          if [ "$local_version" != "$published_version" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.version-check.outputs.changed == 'true'
        run: npm publish --provenance --access public
